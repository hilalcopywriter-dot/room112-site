server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # compression des fichiers texte
    gzip on;
    gzip_types text/css application/javascript image/svg+xml;
    gzip_min_length 512;

    # les assets versionnés peuvent être mis en cache longtemps
    location /assets/ {
        expires 7d;
        add_header Cache-Control "public";
    }

    # la page elle-même reste toujours fraîche
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
